<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <link rel="stylesheet" href="/css-file/forgotpassword.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <div id="heading">
        <h1>Smart Attendance System</h1>
        <h2>Forgot Password</h2>
    </div>

    <div id="box">
        <p id="message">A verification link will be sent to your registered email</p>
        <form id="resetForm">
            <label for="email"><span class="material-icons" id="menuicon">mail</span>Enter Your Email Address </label>
            <input type="email" name="email" id="email" autocomplete="email" required>
            <button type="submit" id="loginBtn">Send Link</button>
            <button type="button" id="loginBtnclick" hidden disabled>Sending...</button>
            <p id="emailnotfound" class="error-message" hidden>Invalid! E-mail Address</p>
            <p id="linksent" class="success-message" hidden>Link sent! Check your inbox.</p>
        </form>
    </div>

    <div>
        <a href="/html-files/loginpage.html" id="loginpage">Back To Login Page</a>
    </div>
