<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <link rel="stylesheet" href="/css-file/login.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <div id="heading">
        <h1>Smart Attendance System</h1>
        <h2>WELCOME</h2>
    </div>
    <div id="box">
        <form>
            <label  for="userid">Enter Your User ID </label>
            <input type="text" name="userid" id="userid" autocomplete="username" required>
            <label  for="password">Enter Your Password</label>
            <input type="password" name="password" id="password" autocomplete="current-password" required>
            <p id="loginError" class="error-message" hidden></p>
            <button id="loginBtn">LOGIN</button>
        </form>
    </div>
    <div>
        <a href="/html-files/forgotpassword.html" id="forgotpassword">Forgot Password?</a>
    </div>
</body>
</html>
