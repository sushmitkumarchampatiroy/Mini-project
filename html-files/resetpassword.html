<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <link rel="stylesheet" href="/css-file/resetpassword.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>
<body>
    <div id="heading">
        <h1>Smart Attendance System</h1>
        <h2>Reset Your Password</h2>
    </div>

    <div id="box">
        <form id="resetpasswordForm">
            <label for="newpwd">Enter New Password</label>
            <input type="text" name="newpwd" id="newpwd" minlength="8" required>
            <label for="cnfpwd">Confirm Password</label>
            <input type="password" name="cnfpwd" id="cnfpwd" minlength="8" required>
            <button type="submit" id="newpasswordsubmit">Set New Password</button>
            <button type="button" id="newpasswordsubmitting" hidden disabled>Setting...</button>
            <p id="incorrect" class="error-message" hidden>Re-check Your Password</p>
            <p id="success" class="success-message" hidden>Password updated successfully!</p>
        </form>
    </div>

    <div>
        <a href="/html-files/loginpage.html" id="loginpage">Back To Login Page</a>
    </div>
